<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Create Account</h1>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email"
               aria-describedby="email-error">
        <span class="error" id="email-error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="country">Country</label>
        <select id="country" name="country" aria-describedby="country-error">
          <option value="">Choose a country</option>
          <option value="ph">Philippines</option>
          <option value="ke">Kenya</option>
          <option value="us">United States</option>
          <option value="ca">Canada</option>
          <option value="gb">United Kingdom</option>
        </select>
        <span class="error" id="country-error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="postal">Postal Code</label>
        <input type="text" id="postal" name="postal" autocomplete="postal-code"
               aria-describedby="postal-error">
        <span class="error" id="postal-error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password"
               aria-describedby="password-error">
        <span class="error" id="password-error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password"
               aria-describedby="confirm-error">
        <span class="error" id="confirm-error" aria-live="polite"></span>
      </div>

      <button type="submit">Create Account</button>
      <p id="form-status" role="status"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
